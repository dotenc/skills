name: Validate plugin
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run check
      - run: bun run test
      - name: Install released CLI in an isolated directory
        run: bun add --cwd "${{ runner.temp }}" --exact @dotenc/cli@0.14.1
      - name: Smoke test CLI workflows with disposable keys
        run: bun run test:cli
        env:
          DOTENC_TEST_CLI: ${{ runner.temp }}/node_modules/@dotenc/cli/dist/cli.js
